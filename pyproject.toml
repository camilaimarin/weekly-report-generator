[project]
name = "weekly-report"
version = "0.1.0"
description = "Reporte semanal de trabajo en HTML, a partir de tus commits"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Camila Itzel Marín Gómez", email = "camilaitzelmarin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "ollama>=0.6.2",
    "pydantic>=2.13.5",
]

[project.scripts]
weekly-report = "weekly_report.cli:main"

[project.optional-dependencies]
pdf = [
    "playwright>=1.63.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
