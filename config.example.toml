# Copia este archivo a config.toml (que está fuera de git) y pon tus datos:
#   cp config.example.toml config.toml

author = "Tu nombre"
role = "Ingeniería de datos · Sistemas de IA · Product Owner"
timezone = "America/Mexico_City"

# Modelo de Ollama que redacta los textos. Los números nunca salen de aquí.
model = "qwen3:4b"

# Todos los correos con los que haces commits (personal, trabajo...).
emails = ["tu@correo.com"]

# Lo que no cuenta en las líneas cambiadas. Acepta nombres ("uv.lock"),
# comodines ("*.min.js"), rutas ("docs/*.html") y carpetas completas
# terminadas en "/" ("vendor/" ignora esa carpeta esté donde esté).
# El commit sigue contando como actividad: solo no suma líneas.
ignore_files = ["uv.lock", "package-lock.json", "*.min.js", "vendor/"]

# Un bloque [[repos]] por repositorio, con el código de proyecto del reporte.
[[repos]]
path = "~/Src/mi-pipeline"
project = "PIPE"

[[repos]]
path = "~/Src/mi-asistente"
project = "AI"
